name: CI

on:
  push:
    branches: [main, fix-ci]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  # nightly.yml runs the slow jobs below through this trigger.
  workflow_call:
  workflow_dispatch:
    inputs:
      libneo_ref:
        default: ''
      full:
        description: run every registered CTest case (set by the libneo full-ci gate)
        default: 'false'
      skip_macos:
        description: Skip macOS build and tests for downstream gate runs
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  CTEST_PARALLEL_LEVEL: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  python-unit:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # setup-python's pip cache uses lsb_release to distinguish Linux images.
      - name: Install Python cache dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lsb-release

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: KIM/python/pyproject.toml

      - name: Install KIM Python test dependencies
        run: python -m pip install -e './KIM/python[test]'

      - name: Run KIM Python unit tests
        run: python -m pytest KIM/python/tests/unit
      - name: Check the nightly triage
        run: python ci/test_nightly_triage.py

  pre-commit:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    name: Pre-commit
    runs-on: [self-hosted, itp-ubuntu24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  build-ubuntu:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    name: Build (Ubuntu)
    needs: pre-commit
    runs-on: [self-hosted, itp-ubuntu24]
    outputs:
      python-version: ${{ steps.python.outputs.python-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            doxygen \
            gfortran \
            libgmp-dev \
            libgsl-dev \
            libhdf5-openmpi-dev \
            liblapack-dev \
            libmpfr-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libomp-dev \
            libopenblas-dev \
            libopenmpi-dev \
            libsuitesparse-dev \
            libsuperlu-dev \
            ninja-build \
            openmpi-bin \
            python3-dev \
            python3-pip
          pip install numpy scipy matplotlib h5py f90nml pytest

      - name: Cache external dependencies
        uses: actions/cache@v6
        with:
          path: build/external-install
          key: external-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Fetch*.cmake') }}
          restore-keys: |
            external-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Build with make
        run: make all ${{ inputs.libneo_ref != '' && format('LIBNEO_REF={0}', inputs.libneo_ref) || '' }}

      # The merge queue tests here instead of in Test (Ubuntu): restoring the
      # build artifact alone took 15 to 17 minutes. Slow tests run nightly.
      - name: Test golden-record harness
        if: github.event_name == 'merge_group'
        run: |
          pip install -e './KIM/python[test]'
          make pytest

      - name: Run KIM Python periodic integration test
        if: github.event_name == 'merge_group'
        env:
          KIM_RUN_INTEGRATION: '1'
          KIM_EXECUTABLE: ${{ github.workspace }}/build/install/bin/KIM.x
        run: python3 -m pytest KIM/python/tests/integration/test_periodic_run.py -v

      - name: Run fast tests
        if: github.event_name == 'merge_group'
        run: ctest --test-dir build --output-on-failure -LE slow

      # Preserve the build directory, executable modes and shared-library symlinks.
      - name: Archive build
        if: github.event_name != 'merge_group'
        run: tar -czf build.tar.gz build

      - name: Upload build artifacts
        if: github.event_name != 'merge_group'
        uses: actions/upload-artifact@v4
        with:
          name: build-ubuntu-latest
          path: build.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build-macos-arm64:
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_macos) ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    name: Build (macOS 14 ARM64)
    needs: pre-commit
    runs-on: [self-hosted, itp-macos]
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    outputs:
      python-version: ${{ steps.python.outputs.python-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up native Python 3.11
        id: python
        run: /opt/itp-ci-macos/setup-python.sh '3.11'

      - name: Install dependencies (macOS)
        run: |
          # Homebrew metadata commands can write locks outside the job sandbox.
          for formula in \
            cmake \
            ninja \
            doxygen \
            gcc \
            llvm \
            lapack \
            openmpi \
            hdf5 \
            netcdf \
            netcdf-fortran \
            libomp \
            openblas \
            gsl \
            suite-sparse \
            superlu \
            mpfr \
            gmp; do
            test -d "/opt/homebrew/opt/$formula" || {
              echo "Missing runner dependency: $formula" >&2
              exit 1
            }
          done
          pip install numpy scipy matplotlib h5py f90nml pytest

      - name: Cache external dependencies
        uses: actions/cache@v6
        with:
          path: build/external-install
          key: external-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Fetch*.cmake') }}
          restore-keys: |
            external-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Build with make
        run: make all ${{ inputs.libneo_ref != '' && format('LIBNEO_REF={0}', inputs.libneo_ref) || '' }}

      # Preserve the build directory, executable modes and shared-library symlinks.
      - name: Archive build
        run: tar -czf build.tar.gz build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-14-arm64
          path: build.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload CMake failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-macos-build
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeError.log
          retention-days: 1
          if-no-files-found: ignore

  test-ubuntu:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    name: Test (Ubuntu)
    needs: build-ubuntu
    runs-on: [self-hosted, itp-ubuntu24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # CTest stores the build runner's absolute interpreter path.
          python-version: ${{ needs.build-ubuntu.outputs.python-version }}

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gfortran \
            libopenmpi-dev \
            openmpi-bin \
            libhdf5-openmpi-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libomp-dev \
            libopenblas-dev \
            liblapack-dev \
            libgsl-dev \
            libsuitesparse-dev \
            libsuperlu-dev \
            python3-dev \
            python3-pip \
            libmpfr-dev \
            libgmp-dev
          pip install numpy scipy matplotlib h5py f90nml pytest
          pip install -e './KIM/python[test]'

      - name: Restore build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-ubuntu-latest
          path: .
          digest-mismatch: error

      - name: Extract build artifacts
        run: tar -xzf build.tar.gz

      - name: Test golden-record harness
        run: make pytest

      - name: Run KIM Python periodic integration test
        env:
          KIM_RUN_INTEGRATION: '1'
          KIM_EXECUTABLE: ${{ github.workspace }}/build/install/bin/KIM.x
        run: python3 -m pytest KIM/python/tests/integration/test_periodic_run.py -v

      # Invoke CTest directly: make test would rebuild after the fresh checkout.
      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$FULL" != true ]; then
            ctest --test-dir build --output-on-failure -LE golden_record
          else
            ctest --test-dir build --output-on-failure
          fi

  test-macos-arm64:
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_macos) ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    name: Test (macOS 14 ARM64)
    needs: build-macos-arm64
    runs-on: [self-hosted, itp-macos]
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up native Python 3.11
        env:
          CI_PYTHON_VERSION: ${{ needs.build-macos-arm64.outputs.python-version }}
        run: /opt/itp-ci-macos/setup-python.sh "$CI_PYTHON_VERSION"

      - name: Install dependencies (macOS)
        run: |
          # Homebrew metadata commands can write locks outside the job sandbox.
          for formula in \
            cmake \
            ninja \
            doxygen \
            gcc \
            llvm \
            lapack \
            openmpi \
            hdf5 \
            netcdf \
            netcdf-fortran \
            libomp \
            openblas \
            gsl \
            suite-sparse \
            superlu \
            mpfr \
            gmp; do
            test -d "/opt/homebrew/opt/$formula" || {
              echo "Missing runner dependency: $formula" >&2
              exit 1
            }
          done
          pip install numpy scipy matplotlib h5py f90nml pytest

      # Owned Mac jobs have separate workspace roots; build here so CTest and
      # library paths belong to this job rather than a previous runner's root.
      - name: Build in the test job workspace
        run: make all ${{ inputs.libneo_ref != '' && format('LIBNEO_REF={0}', inputs.libneo_ref) || '' }}

      - name: Test golden-record harness
        run: make pytest

      # Invoke CTest directly: make test would rebuild after the fresh checkout.
      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$FULL" != true ]; then
            ctest --test-dir build --output-on-failure -LE golden_record
          else
            ctest --test-dir build --output-on-failure
          fi

      - name: Upload CMake failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-macos-test
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeError.log
          retention-days: 1
          if-no-files-found: ignore
