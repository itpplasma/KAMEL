name: CI

on:
  # Pull requests and the merge queue test every change before it reaches main.
  push:
    branches: [fix-ci]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  workflow_dispatch:
    inputs:
      libneo_ref:
        default: ''
      full:
        description: run every registered CTest case (set by the libneo full-ci gate)
        default: 'false'
      skip_macos:
        description: Skip macOS build and tests for downstream gate runs
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  python-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: KIM/python/pyproject.toml

      - name: Install KIM Python test dependencies
        run: python -m pip install -e './KIM/python[test]'

      - name: Run KIM Python unit tests
        run: python -m pytest KIM/python/tests/unit

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  # Build and test run in one job per platform, so the build directory is
  # never archived, uploaded and restored between jobs.
  test-ubuntu:
    name: Test (Ubuntu)
    needs: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            doxygen \
            gfortran \
            libgmp-dev \
            libgsl-dev \
            libhdf5-openmpi-dev \
            liblapack-dev \
            libmpfr-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libomp-dev \
            libopenblas-dev \
            libopenmpi-dev \
            libsuitesparse-dev \
            libsuperlu-dev \
            ninja-build \
            openmpi-bin \
            python3-dev \
            python3-pip
          pip install numpy scipy matplotlib h5py f90nml pytest
          pip install -e './KIM/python[test]'

      - name: Cache external dependencies
        uses: actions/cache@v6
        with:
          path: build/external-install
          key: external-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Fetch*.cmake') }}
          restore-keys: |
            external-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Set parallelism from the CPU budget
        run: ci/set_parallelism.sh

      - name: Build with make
        run: make all ${{ inputs.libneo_ref != '' && format('LIBNEO_REF={0}', inputs.libneo_ref) || '' }}

      - name: Test golden-record harness
        run: make pytest

      - name: Run KIM Python periodic integration test
        env:
          KIM_RUN_INTEGRATION: '1'
          KIM_EXECUTABLE: ${{ github.workspace }}/build/install/bin/KIM.x
        run: python3 -m pytest KIM/python/tests/integration/test_periodic_run.py -v

      # Invoke CTest directly: make test would rebuild.
      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          # Pull requests skip the golden record (run in the merge queue)
          # unless labeled full-ci.
          FAST_TIER: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if { [ "$EVENT_NAME" = workflow_dispatch ] && [ "$FULL" != true ]; } || [ "$FAST_TIER" = true ]; then
            ctest --test-dir build --output-on-failure -LE golden_record
          else
            ctest --test-dir build --output-on-failure
          fi

  test-macos-arm64:
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_macos
    # The hosted macos-14 image is retired. The job keeps its required-check
    # name and builds for macOS 14 (MACOSX_DEPLOYMENT_TARGET) on macos-15.
    name: Test (macOS 14 ARM64)
    needs: pre-commit
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (macOS)
        run: |
          brew install \
            cmake \
            ninja \
            doxygen \
            gcc \
            llvm \
            lapack \
            openmpi \
            hdf5 \
            netcdf \
            netcdf-fortran \
            libomp \
            openblas \
            gsl \
            suite-sparse \
            superlu \
            mpfr \
            gmp
          pip install numpy scipy matplotlib h5py f90nml pytest

      - name: Cache external dependencies
        uses: actions/cache@v6
        with:
          path: build/external-install
          key: external-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Fetch*.cmake') }}
          restore-keys: |
            external-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Set parallelism from the CPU budget
        run: ci/set_parallelism.sh

      - name: Build with make
        run: make all ${{ inputs.libneo_ref != '' && format('LIBNEO_REF={0}', inputs.libneo_ref) || '' }}

      - name: Test golden-record harness
        run: make pytest

      # Invoke CTest directly: make test would rebuild.
      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          # Pull requests skip the golden record (run in the merge queue)
          # unless labeled full-ci.
          FAST_TIER: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if { [ "$EVENT_NAME" = workflow_dispatch ] && [ "$FULL" != true ]; } || [ "$FAST_TIER" = true ]; then
            ctest --test-dir build --output-on-failure -LE golden_record
          else
            ctest --test-dir build --output-on-failure
          fi

      - name: Upload CMake failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-macos-test
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeError.log
          retention-days: 1
          if-no-files-found: ignore
