name: CI

on:
  push:
    branches: [main, fix-ci]
  pull_request:
    branches: [main, feat/kamel-adoption, docs/kim-installation-entrypoint, feat/kim-periodic-example]
  workflow_dispatch:
    inputs:
      libneo_ref:
        default: ''
      full:
        description: run the full suite incl. the golden record (set by the libneo full-ci gate)
        default: 'false'

jobs:
  python-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: KIM/python/pyproject.toml

      - name: Install KIM Python test dependencies
        run: python -m pip install -e './KIM/python[test]'

      - name: Run KIM Python unit tests
        run: python -m pytest KIM/python/tests/unit

      - name: Build KIM Python wheel
        run: python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/kim-wheel" ./KIM/python

      - name: Smoke-test installed KIM wheel
        run: |
          python -m venv "${RUNNER_TEMP}/kim-wheel-venv"
          "${RUNNER_TEMP}/kim-wheel-venv/bin/python" -m pip install "${RUNNER_TEMP}"/kim-wheel/kamel_kim-*.whl
          mkdir "${RUNNER_TEMP}/kim-wheel-check"
          cd "${RUNNER_TEMP}/kim-wheel-check"
          "${RUNNER_TEMP}/kim-wheel-venv/bin/python" "${GITHUB_WORKSPACE}/KIM/python/tests/packaging/check_installed_example.py"

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  build-ubuntu:
    name: Build (Ubuntu)
    needs: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            doxygen \
            gfortran \
            libgmp-dev \
            libgsl-dev \
            libhdf5-openmpi-dev \
            liblapack-dev \
            libmpfr-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libomp-dev \
            libopenblas-dev \
            libopenmpi-dev \
            libsuitesparse-dev \
            libsuperlu-dev \
            ninja-build \
            openmpi-bin \
            python3-dev \
            python3-pip
          pip install numpy scipy matplotlib h5py f90nml pytest

      - name: Cache external dependencies
        uses: actions/cache@v6
        with:
          path: build/external-install
          key: external-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Fetch*.cmake') }}
          restore-keys: |
            external-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Build with make
        run: make all ${{ inputs.libneo_ref != '' && format('LIBNEO_REF={0}', inputs.libneo_ref) || '' }}

      # Preserve the build directory, executable modes and shared-library symlinks.
      - name: Archive build
        run: tar -czf build.tar.gz build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-ubuntu-latest
          path: build.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build-macos-arm64:
    name: Build (macOS 14 ARM64)
    needs: pre-commit
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (macOS)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install \
            cmake \
            ninja \
            doxygen \
            gcc \
            llvm \
            lapack \
            openmpi \
            hdf5 \
            netcdf \
            netcdf-fortran \
            libomp \
            openblas \
            gsl \
            suite-sparse \
            superlu \
            mpfr \
            gmp
          pip install numpy scipy matplotlib h5py f90nml pytest

      - name: Cache external dependencies
        uses: actions/cache@v6
        with:
          path: build/external-install
          key: external-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Fetch*.cmake') }}
          restore-keys: |
            external-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Build with make
        run: make all ${{ inputs.libneo_ref != '' && format('LIBNEO_REF={0}', inputs.libneo_ref) || '' }}

      # Preserve the build directory, executable modes and shared-library symlinks.
      - name: Archive build
        run: tar -czf build.tar.gz build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-14-arm64
          path: build.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  test-ubuntu:
    name: Test (Ubuntu)
    needs: build-ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gfortran \
            libopenmpi-dev \
            openmpi-bin \
            libhdf5-openmpi-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libomp-dev \
            libopenblas-dev \
            liblapack-dev \
            libgsl-dev \
            libsuitesparse-dev \
            libsuperlu-dev \
            python3-dev \
            python3-pip \
            libmpfr-dev \
            libgmp-dev
          pip install numpy scipy matplotlib h5py f90nml pytest
          pip install -e './KIM/python[test]'

      - name: Restore build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-ubuntu-latest
          path: .

      - name: Extract build artifacts
        run: tar -xzf build.tar.gz

      - name: Test golden-record harness
        run: make pytest

      - name: Run KIM Python periodic integration test
        env:
          KIM_RUN_INTEGRATION: '1'
          KIM_EXECUTABLE: ${{ github.workspace }}/build/install/bin/KIM.x
        run: python3 -m pytest KIM/python/tests/integration/test_periodic_run.py -v

      # Invoke CTest directly: make test would rebuild after the fresh checkout.
      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$FULL" != true ]; then
            ctest --test-dir build --output-on-failure -LE golden_record
          else
            ctest --test-dir build --output-on-failure
          fi

  test-macos-arm64:
    name: Test (macOS 14 ARM64)
    needs: build-macos-arm64
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (macOS)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install \
            cmake \
            ninja \
            doxygen \
            gcc \
            llvm \
            lapack \
            openmpi \
            hdf5 \
            netcdf \
            netcdf-fortran \
            libomp \
            openblas \
            gsl \
            suite-sparse \
            superlu \
            mpfr \
            gmp
          pip install numpy scipy matplotlib h5py f90nml pytest

      - name: Restore build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-macos-14-arm64
          path: .

      - name: Extract build artifacts
        run: tar -xzf build.tar.gz

      - name: Test golden-record harness
        run: make pytest

      # Invoke CTest directly: make test would rebuild after the fresh checkout.
      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$FULL" != true ]; then
            ctest --test-dir build --output-on-failure -LE golden_record
          else
            ctest --test-dir build --output-on-failure
          fi
